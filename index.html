<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בשולחן של מכבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* VOICE: warm, homey — a family cookbook passed down the table
   IDEA: a recipe box with tabbed category dividers and index cards
   PICTURE: the card grid itself, each card with a drawn dish for its category
   COLOUR and TYPE: tomato-red tablecloth band, basil green, saffron accent; Secular One + Assistant
   LAYOUT: red header with title, search and tabs; card grid; full recipe page */
:root{color-scheme:light dark;
--bg:light-dark(#fffdf8,#1b1412);--ink:light-dark(#2a1d18,#f6ece6);--soft:light-dark(#6d5a52,#c9b5ab);
--card:light-dark(#ffffff,#271d1a);--line:light-dark(#eadfd6,#3b2d28);
--red:#c8372d;--red2:light-dark(#a92a21,#ef6f63);--basil:light-dark(#3f7a3a,#7fbf74);--saf:#f2b33d;
--field:light-dark(#fff,#211815);--chip:light-dark(#f6ebe4,#3a2a25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Assistant,"Segoe UI",Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Secular One",Assistant,sans-serif;font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--red);color:#fff;padding-bottom:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 24px,transparent 24px 48px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 24px,transparent 24px 48px)}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.top h1{font-size:clamp(36px,5.5vw,56px)}
.top p{margin:8px 0 0;opacity:.92;font-size:18px;max-width:46ch}
.pot{width:150px;height:104px;flex:none}
.tools{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;height:50px;border-radius:14px;border:0;padding:0 46px 0 16px;font-size:17px;background:#fff;color:#2a1d18}
.search svg{position:absolute;right:14px;top:14px;width:22px;height:22px;color:#a08a80}
.btn{height:50px;padding:0 20px;border-radius:14px;border:0;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.add{background:var(--saf);color:#2a1d18}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.main{background:var(--red);color:#fff}
.btn.danger{background:transparent;color:var(--red2);border:2px solid currentColor}
.tabs{display:flex;gap:6px;margin-top:26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;cursor:pointer;padding:12px 16px 14px;border-radius:14px 14px 0 0;background:rgba(255,255,255,.16);color:#fff;font-weight:700;min-height:44px}
.tabs button:hover{background:rgba(255,255,255,.26)}
.tabs button[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.tabs .n{font-weight:400;opacity:.7;margin-inline-start:5px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;color:var(--soft)}
.bar select{height:44px;border-radius:12px;border:2px solid var(--line);background:var(--field);padding:0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.rc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(80,30,20,.14)}
.rc .art{height:132px;display:grid;place-items:center;position:relative}
.rc .art>svg{width:140px;height:105px}
.fav{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);display:grid;place-items:center;cursor:pointer;color:#c8372d}
.rc .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.rc h3{font-size:21px}
.rc p{margin:0;color:var(--soft);font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:14px;color:var(--soft);margin-top:auto;padding-top:6px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--red2);align-self:flex-start}
.empty{text-align:center;padding:60px 16px;color:var(--soft)}
.empty .btn{margin-top:12px}
/* recipe page */
.view{max-width:980px;margin:0 auto}
.back{background:none;border:0;color:var(--red2);font-weight:700;cursor:pointer;padding:10px 0;min-height:44px;font-size:17px}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:center;margin:8px 0 30px}
.hero h2{font-size:clamp(32px,5vw,48px);margin:10px 0 12px}
.story{color:var(--soft);margin:0;font-size:18px;border-inline-start:4px solid var(--saf);padding-inline-start:14px}
.hero .art{border-radius:22px;aspect-ratio:4/3;display:grid;place-items:center}
.hero .art>svg{width:70%;height:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:32px}
.cols>section>h3{font-size:26px;margin-bottom:12px;color:var(--red2)}
.ing{list-style:none;padding:0;margin:0}
.ing li{border-bottom:1px dashed var(--line)}
.ing li.h,.steps li.h{border:0;font-weight:700;color:var(--basil);padding:16px 0 4px;font-size:16px}
.steps li.h{padding-right:0}
.steps li.h::before{display:none}
.ing label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer}
.ing input{width:20px;height:20px;accent-color:var(--basil);margin-top:4px;flex:none}
.ing input:checked+span{text-decoration:line-through;color:var(--soft)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{position:relative;padding:0 50px 18px 0}
.steps li:not(.h){counter-increment:s}
.steps li::before{content:counter(s);position:absolute;right:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--basil);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.tip{margin-top:20px;background:light-dark(#fff6e0,#2f2614);border-radius:14px;padding:14px 16px;border-inline-start:5px solid var(--saf)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
/* dialog */
.dlg{position:fixed;inset:0;background:rgba(30,15,10,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
.dlg.open{display:flex}
.panel{background:var(--bg);border-radius:20px;width:min(680px,100%);padding:24px}
.panel h2{font-size:30px;margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-weight:700;font-size:15px}
.f small{color:var(--soft);font-weight:400}
.f input,.f select,.f textarea{border:2px solid var(--line);border-radius:12px;background:var(--field);padding:10px 12px;font-size:16px;min-height:46px}
.f textarea{min-height:140px;resize:vertical;line-height:1.5}
.f textarea.short{min-height:70px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90vw}
.toast.on{opacity:1}
footer{text-align:center;color:var(--soft);font-size:14px;padding:10px 16px 40px}
@media(max-width:700px){.hero,.cols{grid-template-columns:minmax(0,1fr)}.hero .art{order:-1;aspect-ratio:16/9}.pot{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top">
      <div style="flex:1 1 300px">
        <h1>בשולחן של מכבית</h1>
        <p>האוכל שעובר במשפחה הוא לא רק מתכון – הוא סיפור שלם</p>
      </div>
      <svg class="pot" viewBox="0 0 150 104" aria-hidden="true">
        <path d="M52 18c-4-8 4-12 0-18M75 16c-4-8 4-12 0-18M98 18c-4-8 4-12 0-18" stroke="#ffd9d2" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
        <rect x="18" y="40" width="114" height="12" rx="6" fill="#7a1d16"/>
        <path d="M28 50h94l-8 44a10 10 0 0 1-10 8H46a10 10 0 0 1-10-8z" fill="#f2b33d"/>
        <path d="M28 50h94l-2 12H30z" fill="#d9952a"/>
        <rect x="4" y="56" width="26" height="9" rx="4.5" fill="#7a1d16"/><rect x="120" y="56" width="26" height="9" rx="4.5" fill="#7a1d16"/>
        <rect x="66" y="30" width="18" height="10" rx="5" fill="#7a1d16"/>
        <path d="M44 66h8v28h-6z" fill="#fff" opacity=".35"/>
      </svg>
    </div>
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="חיפוש מתכון או מצרך…" aria-label="חיפוש">
      </div>
      <button class="btn add" id="addBtn" type="button">＋ מתכון חדש</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="קטגוריות"></nav>
  </div>
</header>

<main class="band" id="main"><div class="wrap" id="app"></div></main>
<footer>בשולחן של מכבית · בתיאבון</footer>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <form class="panel" id="form">
    <h2 id="dlgT">מתכון חדש</h2>
    <div class="f"><label for="fT">שם המתכון</label><input id="fT" required></div>
    <div class="f"><label for="fC">קטגוריה</label><select id="fC"></select></div>
    <div class="f"><label for="fD">כמה מילים על המתכון <small>(לא חובה – סיפור, למי זה, מתי מכינים)</small></label><textarea id="fD" class="short"></textarea></div>
    <div class="f"><label for="fI">מצרכים <small>(מצרך בכל שורה. שורה שמתחילה ב-## היא כותרת, למשל: ## לרוטב)</small></label><textarea id="fI"></textarea></div>
    <div class="f"><label for="fP">אופן ההכנה <small>(שלב בכל שורה. גם כאן ## לכותרת)</small></label><textarea id="fP"></textarea></div>
    <div class="f"><label for="fTip">טיפ או הערה <small>(לא חובה)</small></label><input id="fTip"></div>
    <div class="actions" style="border:0;margin-top:6px;padding-top:0">
      <button class="btn main" type="submit">שמירה</button>
      <button class="btn ghost" type="button" id="cancel">ביטול</button>
    </div>
  </form>
</div>
<div class="dlg" id="pw" role="dialog" aria-modal="true" aria-labelledby="pwT">
  <form class="panel" id="pwForm" style="width:min(440px,100%)">
    <h2 id="pwT">סיסמת ניהול</h2>
    <p style="margin:0 0 14px;color:var(--soft)">כדי להוסיף, לערוך או למחוק מתכונים צריך את הסיסמה. המכשיר יזכור אותה.</p>
    <div class="f"><label for="pwIn">סיסמה</label><input id="pwIn" type="password" autocomplete="current-password" required></div>
    <p id="pwErr" style="color:var(--red2);margin:0 0 10px;min-height:1.4em" role="alert"></p>
    <div class="actions" style="border:0;margin-top:0;padding-top:0">
      <button class="btn main" type="submit">כניסה</button>
      <button class="btn ghost" type="button" id="pwCancel">ביטול</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="data">{"recipes":[{"id":"r1","title":"סביצ'ה בטורטייה של מכבית","cat":"starters","desc":"","ing":["150 גר' דג טרי סלומון","100 גר' דג טרי טונה","150 גר' דג טרי לבן (לברק, דניס)","4 צנוניות","3 בצל ירוק – רק את החלק הירוק","1 פלפל חריף (לפי הטעם)","אבוקדו","מלח גס","שמן זית","מיץ לימון","מיץ תפוז","גרידת לימון + גרידת תפוז","חבילת טורטייה מיני"],"steps":["טורטייה מיני – כמות טורטיות רצויה: לחמם תנור, למרוח שמן על הטורטייה בשני הצדדים, לקפל לחצי ולתלות על הרשת של התנור, לאפות קלות ולהוציא מהתנור.","לחתוך את הדגים לקוביות קטנות ולהשרות במיץ לימון ומיץ תפוז כחצי שעה במקרר.","לחתוך לקוביות קטנות את הצנונית, הבצל הירוק, הפלפל החריף והאבוקדו, ולהוסיף גרידת לימון ותפוז.","מכניסים לקערה את מרכיבי הסביצ'ה (ללא הנוזלים של הדג).","להוסיף מעט שמן זית, מלח ומיץ לימון ולערבב.","למלא את הטורטיות לקראת ההגשה."],"tip":"יש אפשרות במקום טורטיות לטגן כדורי פני פורי (לא למלא, הם מתרככים): לשים בצלחת סביצ'ה 3 כדורי פני פורי לצד סלטון קטן. מומלץ להגיש את הטורטייה על סלט עלים קטן."},{"id":"r2","title":"כבד קצוץ של סבתא בתיה","cat":"starters","desc":"שולחן חג תמיד יהיה עם כבד קצוץ. הכבד הקצוץ הוא מעדן מהמטבח היהודי האירופאי.","ing":["500 גר' כבד עוף","3 בצלים","2 ביצים","1 תפוח אדמה גדול","מלח","פלפל שחור","שמן לטיגון","בצל קטן"],"steps":["מרתיחים את תפוח האדמה עם הקליפה לריכוך ואת הביצים לקשות.","חותכים את הבצל ומטגנים אותו במחבת.","מוסיפים את הכבד וממשיכים לטגן, ממליחים ומפלפלים לפי הטעם.","במטחנת בשר מתחילים לטחון את הכבד והבצל, מוסיפים גם את השמן (מוסיף טעם אדיר), טוחנים את הביצים הקשות ותפוח האדמה (יש לקלף אותו לפני). בסוף טוחנים בצל קטן טרי.","מערבבים את העיסה, משפרים טעמים, שמים בקופסה ולמקרר."],"tip":""},{"id":"r3","title":"פטה כבד קצוץ שלי","cat":"starters","desc":"למביני טעם","ing":["300 גר' כבד","150 גר' חמאה","ליקר דובדבנים","14 גר' ג'לטין","מלח","פלפל שחור","חמאה לטיגון (אפשר להשתמש בחמאה מזוקקת)","אלכוהול / ויסקי"],"steps":["מטגנים את הכבד עם חמאה מזוקקת, מוסיפים מלח ופלפל שחור. לקראת סוף הטיגון שמים אלכוהול על הכבד ומדליקים אותו – הכבד מקבל טעם.","במעבד מזון מתחילים לטחון את הכבד, מוסיפים קוביות חמאה, ליקר דובדבנים ואת הג'לטין עד לקבלת מרקם חלק.","משפרים טעמים, שמים בתבניות בגודל הרצוי ומקפיאים."],"tip":"מומלץ להגיש את הפטה עם צנימים וריבה (ריבת בצל עם דובדבנים, ריבת קרמבולה, ריבת תאנים)."},{"id":"r4","title":"מוס טונה","cat":"starters","desc":"לאירוח בראנץ'","ing":["2 קופסאות טונה","1 שמנת חמוצה","כף מיונז","כף קטשופ","בצל קטן מגורד","מיץ מחצי לימון","כפית פלפל שחור","כפית מלח","0.25 גר' ג'לטין","1/3 כוס מים"],"steps":["שמים את הג'לטין בכוס המים, מחכים שהג'לטין יתמוסס, ואז שמים אותו במיקרו.","שמים את כל המצרכים מלבד הג'לטין במעבד מזון עד לקבלת ממרח, טועמים ומשפרים טעמים, ומוסיפים את הג'לטין המומס למעבד המזון. מפעילים למספר שניות.","מעבירים את המוס לתבנית סיליקון / טאפרוור מתאימה.","שמים במקרר ללילה."],"tip":""},{"id":"r5","title":"מח מטוגן","cat":"starters","desc":"למביני עניין","ing":["1 מח נקי מקרום וגידים","2 ביצים","מלח","פלפל שחור","קמח","שמן לטיגון"],"steps":["ראשית צריך לנקות את המח מקרום וגידים – כדאי לעשות את זה מתחת למים זורמים.","לחתוך את המח לחתיכות.","להכין בלילה של ביצים, מלח ופלפל שחור (אפשר להוסיף קצת אבקת מרק עוף), ולהשרות את חתיכות המח בתוך הבלילה.","בצלחת לשים קמח.","לחמם שמן במחבת, לטבול את המח בקמח ולטגן להזהבה.","להגיש עם לימון."],"tip":""},{"id":"r6","title":"מח ברוטב עגבניות","cat":"starters","desc":"למביני עניין","ing":["1 מח נקי מקרום וגידים","מלח","פלפל שחור","צ'ילי חריף לפי הטעם","1 קופסה עגבניות מרוסקות","1/4 כוס שמן","מיץ לימון","פטרוזיליה קצוצה"],"steps":["ראשית צריך לנקות את המח מקרום וגידים – כדאי לעשות את זה מתחת למים זורמים.","לחתוך את המח לחתיכות.","בסוטאז' יש לשים שמן ועגבניות מרוסקות, להוסיף תבלינים ומיץ לימון ולבשל מעט. להוסיף את חתיכות המח להמשך בישול כרבע שעה, להוסיף פטרוזיליה קצוצה ולבשל עוד 5 דקות.","להגיש עם לחם."],"tip":"אפשר גם להכין רוטב עגבניות טרי (או מקופסת שימורים איכותית) עם פטרוזיליה קצוצה ומיץ לימון, ולבשל בו את חתיכות המח. טעים להגיש עם חלה טרייה."},{"id":"r7","title":"סלט ברוקולי כרובית עם בצל ירוק","cat":"salads","desc":"סלט שכולם יבקשו מכם את המתכון שלו","ing":["1 ראש ברוקולי גדול ירוק טרי","1 ראש כרובית","5 בצל ירוק","כוס פיצוחים קלויים – קשיו, בוטנים, חומוס","## רוטב","1/3 כוס מיונז","1.5 כפות חרדל","1/4 כוס שמן זית","2 כפות לימון","1 כף סוכר חום","3 שיני שום","מלח","פלפל שחור"],"steps":["לחתוך את הברוקולי והכרובית ללא הגבעול לפרחים קטנים מאוד.","לקצוץ את הבצל.","מכניסים לקערה את מרכיבי הסלט.","במעבד מזון יש לקצוץ גס את כוס הפיצוחים.","בעזרת בלנדר מוט מכינים את הרוטב.","לפני ההגשה מערבבים את כל המרכיבים של הסלט, שופכים את הרוטב, מערבבים היטב ומגישים."],"tip":""},{"id":"r8","title":"סלט כרוב כרובית עם גרעינים","cat":"salads","desc":"סלט שכולם יבקשו מכם את המתכון שלו","ing":["1 ראש כרוב","1 ראש כרובית","כוס גרעינים: פרוסות שקדים, גרעינים שחורים, גרעיני דלעת ושבבי שומשום","## רוטב","1/8 כוס סילאן","1/8 כוס חומץ בלסמי","1/8 כוס לימון","1/8 כוס שמן","מלח","פלפל שחור"],"steps":["לחתוך את הכרוב לרצועות דקות מאוד ואת הכרובית לגרד בפומפייה גסה.","מכניסים לקערה את מרכיבי הסלט.","יש לקלות את הגרעינים במחבת ולערבב תוך כדי קלייה.","לשים את כל המרכיבים של הרוטב בצנצנת, להכניס למיקרו ולנער היטב.","לפני ההגשה מערבבים את כל המרכיבים של הסלט, שופכים את הרוטב, מערבבים היטב ומגישים."],"tip":""},{"id":"r9","title":"סלט כרוב כרובית עם סומסום וגרעינים","cat":"salads","desc":"סלט שכולם יבקשו מכם את המתכון שלו","ing":["1 ראש כרוב","1 ראש כרובית","כוס וחצי של סומסום לבן ושחור מעורבב, גרעיני חמנייה וגרעיני דלעת מטוגנים במחבת","## רוטב","1/4 כוס חומץ בלסמי","1/4 כוס שמן זית","3 כפות סויה","2 כפות טריאקי","1 כף סוכר חום","2 כפות סילאן","מלח","פלפל שחור"],"steps":["לחתוך את הכרוב לרצועות קטנות.","לגרד את הכרובית בפומפייה עבה ללא הגבעול.","מכניסים לקערה את מרכיבי הסלט.","בעזרת בלנדר מוט מכינים את הרוטב ומחממים אותו מעט במיקרו.","לפני ההגשה מערבבים את כל המרכיבים של הסלט, שופכים את הרוטב החם מעט, מערבבים היטב ומגישים."],"tip":""},{"id":"r10","title":"סלט קוביות חציל עם גבינה פטה","cat":"salads","desc":"","ing":["2 חצילים ארוכים שחורים","3 בצל ירוק","עלי בזיליקום","צנוברים","קובייה גבינה פטה","יש אפשרות להוסיף עגבניות שרי חצויות","ביצה","שמן לטיגון","## רוטב","3 כפות פסטו","1/4 כוס שמן זית","מלח","פלפל שחור"],"steps":["לחתוך את החצילים לקוביות קטנות. בקערה קטנה לשים ביצה, מלח, פלפל שחור ומעט מים, להכניס את החצילים לבלילה ולטגן עד גוון חום.","לקצוץ את הבצל.","מכניסים לקערה את מרכיבי הסלט.","בקערה נפרדת מערבבים היטב את מרכיבי הרוטב (אפשר בעזרת בלנדר מוט).","לפני ההגשה מערבבים את כל המרכיבים של הסלט, שופכים את הרוטב, מערבבים היטב ומגישים."],"tip":""},{"id":"r11","title":"ויניגרט חרדל ודבש","cat":"salads","desc":"","ing":["300 מ\"ל שמן זית","80 גר' חומץ בן יין","1 כף חרדל דיז'ון","1 כף חרדל דיז'ון גרגירים","2 כפות דבש","1 כף מיונז","מלח ופלפל"],"steps":["להכניס את כל החומרים לכלי גבוה ובעזרת מוט בלנדר להקציף עד לאיחוד כל המרכיבים ולקבלת מרקם של רוטב."],"tip":"גרסה נוספת: 1.5 כפות חרדל, 3 כפות דבש ובלי מיונז. אפשר לשמור במקרר."},{"id":"r12","title":"ויניגרט בלסמי","cat":"salads","desc":"","ing":["300 מ\"ל שמן זית","80 מ\"ל חומץ בלסמי","1 כף סילאן","1 כף דבש","1 חלמון","מלח ופלפל שחור"],"steps":["לשים את כל המצרכים בכלי ובעזרת מוט בלנדר לערבב הכל יחד."],"tip":"אפשר לשמור במקרר."},{"id":"r13","title":"מיונז בסיס","cat":"salads","desc":"","ing":["4 חלמונים","4 כפיות חרדל","500 מ\"ל שמן רגיל","1.5 כפות חרדל","2 כפות חומץ בן יין לבן","מלח ופלפל שחור"],"steps":["מכניסים את החלמונים והחרדל למיקסר וטורפים עד שהנוזל מסמיך מעט.","מזליפים את השמן באיטיות תוך טריפה עד שהמיונז מסמיך.","מוסיפים את החומץ ומתבלים במלח ופלפל."],"tip":"אפשר גם בבלנדר: שמים את כל המצרכים, מפעילים ומוסיפים את השמן בהדרגה. לשמור במקרר."},{"id":"r14","title":"חמאה מזוקקת","cat":"salads","desc":"לא נשרפת בתהליך הטיגון. כדאי להכין שיהיה מוכן במקרר בקופסה.","ing":["חמאה – מינימום 400 גר'"],"steps":["שמים את החמאה בסיר גבוה על אש נמוכה.","לאט לאט החמאה מתבשלת, המים מתאדים, החלב מתאחד ונשאר שומן.","כשאין יותר אדים סוגרים את האש ומעבירים את הנוזל דרך מסננת."],"tip":""},{"id":"r15","title":"מרק אפונה שלי","cat":"soups","desc":"איך ששיר אומרת: \"אני רוצה את המרק הירוק\". מרק אהוב על כל בני הבית.","ing":["1 כוס אפונה יבשה","1/4 כוס מש","1/4 כוס כוסמת ירוקה","1.25 כוס אפונה סנפרוסט (אפשר קופסת שימורים אפונה)","4 כוסות מים (או ציר עוף, לא חובה)","שורש כרפס + 2 גבעולים של כרפס","שורש סלרי חתוך לקוביות","2 גבעולי סלרי","1 בצל לבן","מלח","פלפל שחור","אבקת מרק עוף"],"steps":["שמים את כל המרכיבים בסיר, מבשלים ומערבבים מדי פעם.","לאחר התרככות מרסקים את המרק בעזרת בלנדר מוט.","ממשיכים לבשל עוד כחצי שעה, טועמים, ואם צריך מוסיפים מלח או משפרים טעמים."],"tip":"להגשה אפשר להוסיף למרק כחצי כוס אפונה, קרוטונים, שקדי מרק או לחם קלוי מרוח בשמן זית ושום."},{"id":"r16","title":"מרק עגבניות של סבתא בתיה","cat":"soups","desc":"מרק עגבניות הוא אחד המרקים החביבים עליי ועל עמרם, אז בדרך כלל אנחנו אוכלים אותו באמצע השבוע. פחות חביב על הילדים – פשוט לא אוהבים עגבניות.","ing":["2 קופסאות עגבניות מרוסקות של מודי","1 רסק עגבניות גדול","3 כוסות מים (או ציר ירקות, לא חובה)","מלח","כף סוכר","פפריקה מתוקה","צ'ילי חריף","אבקת מרק עוף","קצת אורגנו, בזיליקום וטימין יבש"],"steps":["שמים את כל המרכיבים בסיר, מבשלים ומערבבים יחד כ-15 דקות.","מרסקים את המרק בעזרת בלנדר מוט.","ממשיכים לבשל עוד כשעה, טועמים, ואם צריך מוסיפים מלח או משפרים טעמים."],"tip":"אצלנו אוכלים את המרק עם חביתיות (ראו מתכון \"בלינצ'ס חביתיות למרק עגבניות\"), עם אורז לבן או עם לחם קלוי מרוח בשמן זית ושום."},{"id":"r17","title":"בלינצ'ס חביתיות למרק עגבניות של סבתא בתיה","cat":"soups","desc":"","ing":["3 כוסות מים","2.5 כוסות קמח","1/2 כוס קורנפלור","4 ביצים","1 שקית אבקת אפייה","1 כפית פלפל שחור","1 כפית מלח","30 גר' שמן"],"steps":["טורפים את כל הרטובים ומוסיפים את שאר המצרכים, משקשקים היטב עם בלנדר מוט.","במחבת משומנת יוצקים מצקת קטנה מהבלילה ועושים חביתיות קטנות.","חוזרים על הפעולה עם כל הבלילה.","אפשר להגיש ליד המרק או בתוך המרק."],"tip":""},{"id":"r18","title":"דג סלומון / נסיכת הנילוס ברוטב מיונז וחרדל","cat":"fish","desc":"","ing":["נתחי דג סלומון / נסיכת הנילוס","מלח","פלפל שחור","5 כפות מיונז איכותי","2.5 כפות חרדל","1.5 כפות דבש","2 שיני שום כתושות","2 כפות מיץ לימון","חופן פרוסות שקדים"],"steps":["מחממים תנור ל-200 מעלות.","מערבבים בקערה את המיונז, החרדל, הדבש, השום הכתוש, מיץ הלימון, המלח והפלפל עד לקבלת קרם חלק ואחיד.","מורחים שכבה נדיבה על התבנית.","מניחים את נתחי הדג על הקרם, ואז מורחים על החלק הגלוי את שאר הבלילה.","מפזרים את פרוסות השקדים.","אופים כ-20 דקות עד לקבלת גוון חום בהיר."],"tip":""},{"id":"r19","title":"פילה דג ברוטב עגבניות","cat":"fish","desc":"מנה ראשונה בארוחת שישי","ing":["פילה דג (מושט, לברק, בורי, ברמונדי)","קופסת שימורים עגבניות קצוצות דק","שמן","מיץ לימון","מלח","פלפל שחור","כוסברה קצוצה"],"steps":["משמנים תבנית.","שמים עגבניות בתבנית, מיץ לימון, מלח ופלפל שחור.","מניחים את פילה הדג ברוטב.","שמים שוב עגבניות, מיץ לימון, מלח ופלפל שחור.","מפזרים כוסברה קצוצה למעלה.","אופים בתנור לפני ההגשה."],"tip":""},{"id":"r20","title":"גיבץ' שרימפס","cat":"fish","desc":"","ing":["2 פלפלים ירוקים חתוכים לקוביות","1 פלפל אדום חתוך לקוביות","1/4 פלפל חריף קצוץ לקוביות קטנות מאוד","4 עגבניות חתוכות לקוביות","שמן","מלח","פלפל שחור","חבילת שרימפס קטנים (מופשרים, ללא נוזלים)","100 גר' גבינה צהובה מגורדת"],"steps":["לקלף את העגבניות ולחתוך אותן לקוביות קטנות.","לחתוך לקוביות קטנות את הפלפלים.","לשים את כל המרכיבים יחד בסוטאז' ולבשל עד ריכוך. להוסיף מלח ופלפל שחור ולערבב.","להוסיף את השרימפס ולהמשיך לבשל עד שכל הנוזלים מצטמצמים.","לטעום ולתקן טעמים, לפזר את הגבינה הצהובה ולהכניס לתנור שחומם מראש ל-180 מעלות לרבע שעה.","להגיש עם לחם טרי."],"tip":""},{"id":"r21","title":"אוסובוקו טלה שלי","cat":"meat","desc":"למביני טעם ולארוחות מיוחדות","ing":["שוקי טלה לפי מספר הסועדים (לקנות בחנויות בשר מתמחות)","חצי כוס קמח","מלח","פלפל שחור","שמן","1 בקבוק יין אדום","ציר בקר לפי הנדרש (לפחות 2 ליטר)","ירקות ארומטיים / שורש חתוכים לקוביות: שורש סלרי, שורש פטרוזיליה, גזר, גבעולי סלרי, כרשה, שיני שום","עלי דפנה, פלפל אנגלי"],"steps":["ממליחים, מפלפלים, מקמחים קלות את האוסובוקו וסוגרים / מטגנים אותו בסיר.","מוסיפים את הירקות הארומטיים, בקבוק היין, ציר בקר ותבלינים.","מכניסים לתנור שחומם מראש לחום גבוה, 220 מעלות, לכחצי שעה. לאחר מכן מורידים את החום ל-150 מעלות לעוד כ-3 שעות."],"tip":"מומלץ להגיש עם פירה."},{"id":"r22","title":"צוואר כבש / זנב שור עם בצל ירוק ושיני שום","cat":"meat","desc":"פשוט טעים","ing":["2.5 ק\"ג צוואר כבש חתוך או זנב שור חתוך (אפשר לערבב כמה סוגי בשר)","2 חבילות בצל ירוק חתוך","20 שיני שום","מלח","פלפל שחור","אפשר להוסיף צרור טימין טרי","ציר בקר / מים עם אבקת מרק עוף"],"steps":["בתחתית הסוטאז' או סיר החרס שמים שיני שום ובצל ירוק.","מסדרים את הבשר מעל, ואת יתרת הבצל הירוק והשום. מוסיפים ציר, ממליחים ומפלפלים.","מכניסים לתנור שחומם מראש לחום גבוה, 220 מעלות, לכחצי שעה. לאחר מכן מורידים את החום ל-150 מעלות לעוד כ-3 שעות לפחות."],"tip":""},{"id":"r23","title":"בשר בקר – שריר","cat":"meat","desc":"רך ופשוט טעים","ing":["2 ק\"ג בשר שריר חתוך לטבעות","20 שיני שום","מלח","פלפל שחור","חופן פלפל אנגלי","עלי דפנה","ציר בקר / מים עם אבקת מרק עוף","1/4 כוס שמן"],"steps":["בסוטאז' מסדרים את טבעות הבשר, שמים שיני שום, פלפל אנגלי, עלי דפנה, מלח ופלפל שחור.","מוסיפים ציר שמכסה את הבשר + שמן.","מכניסים לתנור שחומם מראש לחום גבוה, 220 מעלות, ל-45 דקות. לאחר מכן מורידים את החום ל-150 מעלות לעוד כשעתיים לפחות. מדי פעם בודקים שיש נוזלים, ואם חסר מוסיפים."],"tip":""},{"id":"r24","title":"קציצות בקר ברוטב עגבניות","cat":"meat","desc":"כולם אוהבים, קטנים וגדולים","ing":["500 גר' בשר בקר טחון","2 ביצים","1 בצל","5 שיני שום","1 תפוח אדמה","מלח","פלפל שחור","אבקת מרק עוף","שמן לטיגון","2 קופסאות עגבניות מרוסקות","1 רסק עגבניות"],"steps":["מערבבים בקערה את הבשר הטחון ותפוח אדמה מגורד וסחוט מהנוזלים שלו, בצל ושום מרוסקים (אפשר לרסק במעבד מזון את תפוח האדמה, הבצל והשום), ומוסיפים ביצים.","מניחים את העיסה במקרר לפחות לשעה, אפשר ללילה, להעצמת טעמים ולהתחברות.","יוצקים למחבת שמן בגובה חצי ס\"מ ומחממים על להבה בינונית. מטגנים קציצה קטנה, טועמים ומתקנים טעמים אם נדרש.","יוצרים מהתערובת קציצות קטנות ופחוסות ומטגנים אותן.","בסוטאז' שמים את העגבניות המרוסקות, רסק העגבניות וחצי כוס מים, מתבלים במלח, צ'ילי ופפריקה מתוקה ומבשלים (אין צורך להוסיף שמן). מוסיפים את הקציצות המטוגנות.","מעבירים לתנור לעוד כשעה."],"tip":"הכמות: כ-30 קציצות."},{"id":"r25","title":"קציצות פרסה","cat":"meat","desc":"אין ליל סדר ללא קציצות פרסה – הקציצ בצק בין שני דפי אפייה מרוחים בשמן לעובי הכי דק שאפשר.","להניח את הבצק עם נייר האפייה התחתון בתבנית (אני חתכתי בעזרת חותך פיצה לריבועים).","אופים בתנור שחומם מראש ל-200 מעלות."],"tip":""},{"id":"r34","title":"בלינצ'ס של סבתא בתיה","cat":"brunch","desc":"ביס אחד ממנה וכל הילדות שלי נפרסת לפניי... זה מדהים איך שטעם מעלה זיכרונות. כל חופש אצל סבתא בתיה ביסוד המעלה, הנכדים עדי, איציק ובת אל היו מקבלים בלינצ'ס ענק מטוגן במחבת מרומניה, במילוי לפי בחירה.","ing":["3 כוסות חלב","2 כוסות קמח","4 ביצים","1 שקית סוכר וניל","3 כפות סוכר","קמצוץ מלח","50 גר' חמאה מומסת או שמן"],"steps":["טורפים את כל הרטובים ומוסיפים את שאר המצרכים, משקשקים היטב עם מטרפה.","במחבת משומנת יוצקים מצקת מהבלילה ומנערים את המחבת בתנועה סיבובית לקבלת בלינצ'ס שטוח, דק ועגול.","חוזרים על הפעולה עם כל הבלילה.","מורחים את המילוי הרצוי – שוקולד, נוטלה, שחר... והכי חשוב: לגלגל (ולא לקפל)."],"tip":""},{"id":"r35","title":"קרפ אמיתי של מוניק","cat":"brunch","desc":"","ing":["250 גר' קמח","3 ביצים","1 כף סוכר","קמצוץ מלח","2 כפות שמן","1/2 ליטר חלב","קצת בירה (אני שמה ויסקי)"],"steps":["טורפים את כל הרטובים ומוסיפים את שאר המצרכים, טורפים היטב עם מטרפה ידנית ונותנים לנוח לפחות שעה.","במחבת משומנת יוצקים מצקת מהבלילה ומנערים את המחבת בתנועה סיבובית לקבלת קרפ שטוח, דק ועגול.","חוזרים על הפעולה עם כל הבלילה.","מורחים את המילוי הרצוי – שוקולד, נוטלה, שחר, אגוזים, בננה.","מקפלים את הקרפ לשניים ואחר כך לרבע."],"tip":""},{"id":"r36","title":"פנקייק גבינה","cat":"brunch","desc":"","ing":["2 ביצים","120 גר' סוכר","300 גר' גבינה לבנה 9%","2 כפות חלב","2 שקיות סוכר וניל","1/2 כפית סודה לשתייה","כף מיץ לימון","גרידה מלימון אחד","180 גר' קמח"],"steps":["מערבבים גבינה עם ביצים, חלב, מיץ לימון וגרידת לימון לבלילה, מוסיפים את החומרים היבשים ומערבבים לבלילה אחידה.","מחממים מחבת (מחבת שקעים), מורחים שמן, מוסיפים לכל שקע מהבלילה ומטגנים כ-2 דקות מכל צד.","מגישים עם מה שאוהבים."],"tip":"יש אפשרות להוסיף אוכמניות קטנות."},{"id":"r37","title":"פפאנש","cat":"brunch","desc":"הסופגנייה שהיא גם גבינה, הישר מרומניה","ing":["500 גר' גבינה לבנה יבשה לאפייה (כגון טבורוג / טוב טעם)","2–3 ביצים טרופות היטב","100 גר' סוכר","קמצוץ מלח","200 גר' קמח","כפית אבקת אפייה / או סודה לשתייה","1/2 כפית תמצית וניל","כפית גרידת לימון או תפוז","1 כפית מיץ לימון","## להגשה","שמנת חמוצה","ריבת דובדבנים / תות"],"steps":["בקערת המיקסר עם וו גיטרה שמים גבינה, סוכר, וניל וגרידת לימון וטורפים עד לקבלת תערובת אחידה.","מוסיפים את הביצים הטרופות וטורפים עד להטמעה, ומוסיפים את מיץ הלימון.","בקערה נפרדת מערבבים קמח, מלח ואבקת אפייה.","מוסיפים את הקמח בהדרגה לתערובת הגבינה עד להטמעה מלאה. נותנים לתערובת לנוח כחצי שעה בטמפרטורת החדר.","כל פפאנש מורכב מבסיס דונאט ומעליו כדור. אני מאוד אוהבת מאפים קטנים: מחלקים את הבצק ל-50 גר' לדונאט ול-10 גר' לכדור. את הכדורים הגדולים פוחסים ביד לדסקית וקורצים במרכזה חור עם האצבע (לעבוד עם ידיים משומנות).","מטגנים עד להזהבה משני הצדדים.","מגישים עם שמנת חמוצה וריבת דובדבנים / תות."],"tip":""},{"id":"r38","title":"עוגת דבש של שאולי לכבוד ראש השנה","cat":"cakes","desc":"במשך שנותיי קיבלתי ואספתי מתכונים מומלצים וטעימים. גם את עוגת הדבש הזאת קיבלתי משאולי – וגם הוא אהב את המטבח.","ing":["350 גר' קמח","2 כפיות אבקת אפייה","1 כפית סודה לשתייה","4 ביצים","200 גר' סוכר חום","220 מ\"ל שמן","320 גר' דבש","כפית קינמון","כפית זנגביל","קמצוץ ציפורן","כוס נס קפה / אספרסו חזק – חם","אגוזים"],"steps":["מחממים תנור ל-160 מעלות.","מערבבים בקערה את הקמח, אבקת האפייה, הסודה לשתייה, הקינמון, הזנגביל והציפורן.","מערבבים שמן ודבש.","בקערת המערבל מקציפים ביצים וסוכר לקצף חזק.","מורידים את המהירות ומוסיפים שליש מהחומרים היבשים ושליש מהדבש והשמן, וכך הלאה עד השליש האחרון, לקבלת עיסה אחידה.","מוסיפים בבת אחת כוס נס קפה / אספרסו חם וחזק לעיסה ומערבבים מספר שניות.","יוצקים לתבנית אפייה משומנת.","מפזרים מעל העיסה את האגוזים ואופים כ-45 דקות."],"tip":""},{"id":"r39","title":"עוגת טריפל שוקולד","cat":"cakes","desc":"עוגת שחיתות. קצת עבודה אבל שווה את המאמץ. מתאימה גם לפסח, ויש אפשרות לעשות רק את המוס ולהגיש בכוסות.","ing":["## תחתית פאדג'","300 גר' שוקולד מריר","150 גר' חמאה","1/3 כוס חלב","6 ביצים","3/4 כוס סוכר","2 כפות קורנפלו פסה ממרח תמרים"],"steps":["במעבד מזון שמים את כל המרכיבים (חוץ מהתמרים) ומעבדים עד לקבלת בצק.","מניחים את הבצק לנוח במקרר כחצי שעה.","מחלקים את הבצק ל-4.","מרדדים על נייר אפייה, מורחים ממרח תמרים ומגלגלים לרולדה. מניחים בתבנית וממשיכים עם כל הרולדות.","חורצים בסכין חדה את העוגיות עד הסוף.","אופים כ-35 דקות ב-180 מעלות, בתנור שחומם מראש, עד הזהבה.","חותכים אחרי שהעוגיות מתקררות, מפדרים באבקת סוכר ומכניסים לכלי אטום."],"tip":"אפשר להוסיף אגוזי מלך טחונים דק על התמרים."}]}</script>

let state = JSON.parse(document.getElementById('data').textContent);
let cat = 'all', query = '', sort = 'az', editing = null;

const catOf = id => CATS.find(c => c.id === id) || CATS[1];
const isH = s => s.startsWith('##');
const hText = s => s.replace(/^##\s*/, '');
const LS = { get(k,d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
let favs = LS.get('mk-favs', []);
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2800); };
const heart = on => `<svg width="20" height="20" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`;
const clearHash = () => { if (location.hash) history.replaceState(null,'',location.pathname+location.search); };

function renderTabs(){
  const list = [...CATS, {id:'favs',name:'מועדפים'}];
  $('#tabs').innerHTML = list.map(c => {
    const n = c.id==='all' ? state.recipes.length : c.id==='favs' ? state.recipes.filter(r=>favs.includes(r.id)).length : state.recipes.filter(r=>r.cat===c.id).length;
    if (c.id!=='all' && c.id!=='favs' && !n) return '';
    if (c.id==='favs' && !n) return '';
    return `<button type="button" data-cat="${c.id}" aria-pressed="${cat===c.id}">${esc(c.name)}<span class="n">${n}</span></button>`;
  }).join('');
}
function filtered(){
  const q = query.trim();
  let list = state.recipes.filter(r =>
    (cat==='all' || (cat==='favs' ? favs.includes(r.id) : r.cat===cat)) &&
    (!q || [r.title, r.desc, r.tip, ...(r.ing||[])].join(' ').includes(q)));
  if (sort==='az') list = [...list].sort((a,b)=>a.title.localeCompare(b.title,'he'));
  else list = [...list].reverse();
  return list;
}
function renderList(){
  const list = filtered();
  const label = cat==='favs' ? 'מועדפים' : catOf(cat).name;
  let body;
  if (!state.recipes.length) body = `<div class="empty"><h3>הספר מחכה למתכון הראשון</h3><button class="btn main" type="button" id="firstAdd">＋ הוספת מתכון</button></div>`;
  else if (!list.length) body = `<div class="empty"><h3>לא נמצאו מתכונים</h3><p>${cat==='favs'?'לחצו על הלב בכרטיס מתכון כדי לשמור אותו כאן.':'נסו מילה אחרת, או הוסיפו מתכון חדש.'}</p></div>`;

    ${body}`;
}
function card(r){

      <button class="fav" type="button" data-fav="${esc(r.id)}" aria-label="${on?'הסרה ממועדפים':'הוספה למועדפים'}">${heart(on)}</button></div>
    <div class="body"><span class="chip">${esc(c.name)}</span><h3>${esc(r.title)}</h3><p>${esc(blurb)}</p>
      <div class="meta">${nI} מצרכים · ${nS} שלבים</div></div>
  </article>`;
}
function renderRecipe(r){
  const c = catOf(r.cat), on = favs.includes(r.id);
  $('#app').innerHTML = `<div class="view">
    <button class="back" type="button" id="back">→ לכל המתכונים</button>
    <div class="hero"><div><span class="chip">${esc(c.name)}</span><h2>${esc(r.title)}</h2>${r.desc?`<p class="story">${esc(r.desc)}</p>`:''}</div>
      <div class="art" style="background:${c.bg}">${ART[r.cat]||ART.cakes}</div></div>
    <div class="cols">
      <section><h3>מצרכים</h3><ul class="ing">${(r.ing||[]).map((x,i)=> isH(x) ? `<li class="h">${esc(hText(x))}</li>` : `<li><label><input type="checkbox"><span>${esc(x)}</span></label></li>`).join('')}</ul></section>
      <section><h3>אופן ההכנה</h3><ol class="steps">${(r.steps||[]).map(s=> isH(s) ? `<li class="h">${esc(hText(s))}</li>` : `<li>${esc(s)}</li>`).join('')}</ol>
        ${r.tip?`<div class="tip"><b>טיפ: </b>${esc(r.tip)}</div>`:''}</section>
    </div>
    <div class="actions">
      <button class="btn ghost" type="button" data-fav="${esc(r.id)}">${heart(on)} ${on?'במועדפים':'למועדפים'}</button>
      <button class="btn ghost" type="button" id="copy">העתקת המתכון</button>
      <button class="btn ghost" type="button" id="edit">עריכה</button>
      <button class="btn danger" type="button" id="del">מחיקה</button>
    </div></div>`;
  scrollTo({top:0});
}
function route(){
  const m = location.hash.match(/^#(r[\w]+)$/);
  const r = m && state.recipes.find(x => x.id === m[1]);
  renderTabs();
  r ? renderRecipe(r) : renderList();
}

let token = LS.get('mk-token','');
const API = '/api/recipes';
async function api(body){
  const res = await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token},body:JSON.stringify(body)});
  let j={}; try{ j = await res.json(); }catch(e){}
  return {ok:res.ok, status:res.status, error:j.error};
}
let pwNext = null;
let openMode = null;
async function needToken(next){
  if (token) { next(); return; }
  if (openMode === null) { try { openMode = (await api({check:true})).ok; } catch(e){ openMode = false; } }
  if (openMode) { next(); return; }
  pwNext = next; $('#pwErr').textContent=''; $('#pwIn').value=''; $('#pw').classList.add('open'); $('#pwIn').focus();
}
$('#pwCancel').addEventListener('click', ()=>$('#pw').classList.remove('open'));
$('#pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  token = $('#pwIn').value.trim(); $('#pwErr').textContent='בודק…';
  let r; try { r = await api({check:true}); } catch(err){ r={ok:false,error:'net'}; }
  if (r.ok){ LS.set('mk-token',token); $('#pw').classList.remove('open'); const n=pwNext; pwNext=null; n && n(); }
  else { token=''; $('#pwErr').textContent = r.error==='bad_token' ? 'הסיסמה לא נכונה' : 'אין חיבור לשרת, נסו שוב'; }
});
async function load(){
  try { const res = await fetch(API,{cache:'no-store'}); if (res.ok){ const d = await res.json(); if (d && Array.isArray(d.recipes)){ state = d; route(); } } } catch(e){}
}
async function save(msg){
  let r; try { r = await api({recipes: state.recipes}); } catch(e){ r={ok:false,error:'net'}; }
  if (r.ok) { toast(msg); return; }
  if (r.error==='bad_token'){ token=''; LS.set('mk-token',''); toast('הסיסמה השתנתה או לא נכונה – השינוי לא נשמר'); }
  else toast('השמירה נכשלה – השינוי לא נשמר');
  load();
}

function openForm(r){
  editing = r ? r.id : null;
  $('#dlgT').textContent = r ? 'עריכת מתכון' : 'מתכון חדש';
  $('#fC').innerHTML = CATS.slice(1).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#fT').value = r?.title||''; $('#fD').value = r?.desc||'';
  $('#fC').value = r?.cat || (cat!=='all'&&cat!=='favs'?cat:'cakes');
  $('#fI').value = (r?.ing||[]).join('\n'); $('#fP').value = (r?.steps||[]).join('\n'); $('#fTip').value = r?.tip||'';
  $('#dlg').classList.add('open'); $('#fT').focus();
}
const closeForm = () => $('#dlg').classList.remove('open');
$('#cancel').addEventListener('click', closeForm);
$('#dlg').addEventListener('click', e => { if (e.target.id==='dlg') closeForm(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') { closeForm(); $('#pw').classList.remove('open'); } });
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const lines = v => v.split('\n').map(s=>s.trim()).filter(Boolean);
  const rec = { id: editing || ('r'+Date.now().toString(36)), title: $('#fT').value.trim(), cat: $('#fC').value, desc: $('#fD').value.trim(),
    ing: lines($('#fI').value), steps: lines($('#fP').value), tip: $('#fTip').value.trim() };
  if (!rec.title) return;
  if (editing) state.recipes = state.recipes.map(r => r.id===editing ? rec : r); else state.recipes.push(rec);
  closeForm(); location.hash = rec.id; route();
  save(editing ? 'המתכון עודכן' : 'המתכון נוסף לספר');
});

$('#addBtn').addEventListener('click', () => needToken(() => openForm(null)));
$('#q').addEventListener('input', e => { query = e.target.value; if (query.trim()) cat = 'all'; clearHash(); route(); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; clearHash(); route(); });
$('#app').addEventListener('change', e => { if (e.target.id==='sort'){ sort = e.target.value; renderList(); } });
$('#app').addEventListener('click', async e => {
  if (e.target.closest('#firstAdd')) { needToken(() => openForm(null)); return; }
  const f = e.target.closest('[data-fav]');
  if (f){ e.stopPropagation(); const id=f.dataset.fav; favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs,id]; LS.set('mk-favs',favs); if (cat==='favs' && !favs.length) cat='all'; route(); return; }
  const o = e.target.closest('[data-open]'); if (o){ location.hash = o.dataset.open; return; }
  if (e.target.closest('#back')){ clearHash(); route(); return; }
  const r = state.recipes.find(x => location.hash === '#' + x.id);
  if (!r) return;
  const id = e.target.closest('button')?.id;
  if (id==='edit') needToken(() => openForm(r));
  if (id==='del'){
    const b = e.target.closest('button');
    if (b.dataset.sure){ if (!token && !openMode) { needToken(()=>{ b.dataset.sure=''; b.textContent='מחיקה'; toast('עכשיו אפשר למחוק – לחצו שוב'); }); return; } state.recipes = state.recipes.filter(x=>x.id!==r.id); clearHash(); route(); save('המתכון נמחק'); }
    else { b.dataset.sure='1'; b.textContent='לחצו שוב לאישור המחיקה'; }
  }
  if (id==='copy'){
    const L = a => a.map(x => isH(x) ? '\n'+hText(x)+':' : '• '+x).join('\n');
    let n=0; const St = r.steps.map(s => isH(s) ? '\n'+hText(s)+':' : (++n)+'. '+s).join('\n');
    const txt = `${r.title}${r.desc?'\n'+r.desc:''}\n\nמצרכים:\n${L(r.ing)}\n\nאופן ההכנה:\n${St}${r.tip?'\n\nטיפ: '+r.tip:''}\n\n— בשולחן של מכבית`;
    try { await navigator.clipboard.writeText(txt); toast('המתכון הועתק – אפשר להדביק בוואטסאפ'); } catch(err){ toast('ההעתקה לא זמינה כאן'); }
  }
});
$('#app').addEventListener('keydown', e => { const o = e.target.closest('[data-open]'); if (o && e.key==='Enter' && e.target===o) location.hash = o.dataset.open; });
window.addEventListener('hashchange', route);
route();
load();
}
</script>
</body>
</html>
